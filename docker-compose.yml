version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderai_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=true
      - PORT=8000
      - AI_PROVIDER=mock
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wanderai_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
