services:
  - type: web
    name: wanderai-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["https://*.netlify.app","http://localhost:3000"]'
